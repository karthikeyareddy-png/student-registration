<!DOCTYPE html>
<html>
<head>
    <title>Student Details</title>
</head>
<body>

    <h2>Student Registration</h2>

    <form>
        <label>Name:</label>
        <input type="text" name="name">
        <br><br>

        <label>Student ID:</label>
        <input type="text" name="id">
        <br><br>

        <label>Department:</label>
        <select name="department">
            <option>CSE</option>
            <option>ECE</option>
            <option>EEE</option>
            <option>MECH</option>
            <option>CIVIL</option>
        </select>
        <br><br>

        <input type="submit" value="Submit">
    </form>

</body>
</html>
